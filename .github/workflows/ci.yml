name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  periksa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Pasang Chromium untuk Playwright
        run: npx playwright install --with-deps chromium
      - name: Smoke test di browser (390 px dan 1440 px)
        run: npm run test:e2e -- --trace off
        env:
          NEXT_TELEMETRY_DISABLED: "1"
