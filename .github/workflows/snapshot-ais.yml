name: Snapshot AIS

# Menyimak aisstream.io ~90 detik lalu menyimpan posisi kapal ke cabang `data` (kapal.json).
# Browser membaca berkas itu lewat raw.githubusercontent.com, jadi tidak perlu deploy ulang.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cabang-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r scripts/requirements.txt
      - name: Simak AIS
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python scripts/ambil_ais.py --durasi 90 --keluar keluar/kapal.json
      - name: Simpan ke cabang data
        run: bash scripts/simpan_cabang_data.sh keluar/kapal.json
