name: Snapshot AIS

# Menyimak aisstream.io ~4 menit lalu menyimpan posisi kapal ke cabang `data` (kapal.json).
# Browser membaca berkas itu lewat raw.githubusercontent.com, jadi tidak perlu deploy ulang.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cabang-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r scripts/requirements.txt
      - name: Simak AIS
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: |
          mkdir -p keluar
          curl -sf "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/kapal_statis.json" -o keluar/kapal_statis.json || true
          python scripts/ambil_ais.py --durasi 240 --keluar keluar/kapal.json --statis keluar/kapal_statis.json
      - name: Simpan ke cabang data
        run: bash scripts/simpan_cabang_data.sh keluar/kapal.json keluar/kapal_statis.json
